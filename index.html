<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>App Censo Pedra Vermelha</title>

<style>
:root{
--pedra:#8f2f20;
--pedra-escura:#5f1d14;
--barro:#b85c38;
--areia:#f6e7c9;
--texto:#2d1f1a;
--muted:#735b4d;
--sol:#e0a632;
--sombra:0 18px 45px rgba(95,29,20,.16)
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
color:var(--texto);
background:linear-gradient(135deg,#fff7e8,#f2d9b4,#e7b98a);
min-height:100vh
}
.hidden{display:none!important}
header{
background:linear-gradient(135deg,var(--pedra-escura),var(--pedra),var(--barro));
color:#fff;
padding:30px;
text-align:center;
border-radius:0 0 30px 30px
}
.container{max-width:1200px;margin:auto;padding:20px}
.login-wrap{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh
}
.login-card{
background:#fff;
padding:30px;
border-radius:25px;
width:100%;
max-width:450px;
box-shadow:var(--sombra)
}
label{display:block;margin:10px 0 5px;font-weight:bold}
input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:12px
}
button{
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold
}
.main{background:var(--pedra);color:#fff}
.secondary{background:#eee}
.danger{background:#c00;color:#fff}
.notice{
background:#eaf8e9;
padding:10px;
border-radius:10px;
margin-top:10px
}
.grid-2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.family-row{
display:grid;
grid-template-columns:repeat(5,1fr) 50px;
gap:8px;
margin-top:8px
}
section{
background:#fff;
padding:20px;
border-radius:20px;
margin-top:15px
}
.tabs button{margin-right:10px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
<div class="login-card">
<h1>Censo Pedra Vermelha</h1>
<p>Acesso restrito</p>

<div id="loginMsg"></div>

<form id="loginForm">
<label>Usuário</label>
<input id="loginUsuario" required>

<label>Senha</label>
<input id="loginSenha" type="password" required>

<br><br>
<button class="main" type="submit">Entrar</button>
</form>

<div class="notice">
Acesso restrito ao sistema
</div>
</div>
</div>

<div id="appScreen" class="hidden">

<header>
<h1>Censo Pedra Vermelha</h1>
</header>

<div class="container">

<section id="cadastro">

<h2>Novo Cadastro</h2>

<label>Tipo</label>
<select id="tipoFormulario">
<option value="domiciliar">Domiciliar</option>
</select>

<form id="formCenso">

<h3>5. Trabalho e Renda</h3>

<div class="grid-2">

<div>
<label>Responsável Financeiro</label>

<select id="d_respFinanceiro">
<option></option>
<option>Eu</option>
<option>Meu pai</option>
<option>Minha mãe</option>
<option>Meu pai e minha mãe</option>
<option>Eu e meu pai</option>
<option>Eu e minha mãe</option>
<option>Eu e meu cônjuge</option>
<option>Cônjuge</option>
<option>Outro familiar</option>
<option>Outro</option>
</select>
</div>

<div>
<label>Profissão</label>
<input id="d_profissao">
</div>

</div>

<h3>7. Educação</h3>

<div class="grid-2">
<label>
<input type="checkbox" id="d_escola">
Há crianças estudando
</label>

<label>
<input type="checkbox" id="d_evasao">
Existe evasão escolar
</label>
</div>

<div id="educacaoLista"></div>

<button type="button"
class="secondary"
onclick="addEducacao()">
+ Adicionar Criança
</button>

<br><br>

<label>Maior escolaridade da família</label>
<input id="d_escolaridadeFamilia">
<br><br>

<button type="submit" class="main">
Salvar Cadastro
</button>

</form>
</section>

</div>
</div>

<script>

const STORAGE_KEY='censo';

function obterDados(){
return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')
}

function salvarDados(d){
localStorage.setItem(STORAGE_KEY,JSON.stringify(d))
}

function campo(id){
return document.getElementById(id)?.value||''
}

function checked(id){
return document.getElementById(id)?.checked?'Sim':'Não'
}

function addEducacao(item={}){

const div=document.createElement('div');

div.className='family-row';

div.innerHTML=`
<input placeholder="Nome"
value="${item.nome||''}">

<input placeholder="Idade"
value="${item.idade||''}">

<input placeholder="Escola"
value="${item.escola||''}">

<input placeholder="Série/Ano"
value="${item.serie||''}">

<input placeholder="Turno"
value="${item.turno||''}">

<button
type="button"
class="danger"
onclick="this.parentElement.remove()">
X
</button>
`;

document.getElementById('educacaoLista')
.appendChild(div);

}

function getEducacao(){

return Array.from(
document.querySelectorAll(
'#educacaoLista .family-row'
)
).map(r=>{

const i=r.querySelectorAll('input');

return{
nome:i[0].value,
idade:i[1].value,
escola:i[2].value,
serie:i[3].value,
turno:i[4].value
}

});

}

document.getElementById('formCenso')
.addEventListener('submit',e=>{

e.preventDefault();

const dados=obterDados();

dados.push({

responsavelFinanceiro:
campo('d_respFinanceiro'),

profissao:
campo('d_profissao'),

haCriancas:
checked('d_escola'),

evasao:
checked('d_evasao'),

educacao:
getEducacao(),

escolaridade:
campo('d_escolaridadeFamilia')

});

salvarDados(dados);

alert('Cadastro salvo com sucesso');

document.getElementById('formCenso').reset();

document.getElementById('educacaoLista')
.innerHTML='';

addEducacao();

});
  addEducacao();

document.getElementById('loginForm')
.addEventListener('submit',function(e){

e.preventDefault();

const usuario=
document.getElementById('loginUsuario').value;

const senha=
document.getElementById('loginSenha').value;

if(usuario==='admin' && senha==='admin123'){

document.getElementById('loginScreen')
.classList.add('hidden');

document.getElementById('appScreen')
.classList.remove('hidden');

}else{

document.getElementById('loginMsg')
.innerHTML=
'<div class="notice" style="background:#ffdede;color:red">Usuário ou senha inválidos</div>';

}

});

</script>

</body>
</html>
